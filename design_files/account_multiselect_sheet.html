<div style="min-height: 400px; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; border-radius: 12px; padding: 1rem 0;">
    <h2 class="sr-only">Account multi-select filter sheet with checkboxes for each account and an
        apply button</h2>
    <div style="background: var(--surface-2); border-radius: 20px 20px 0 0; padding: 1.25rem; width: 380px; max-width: 100%;">

        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 1rem;"></div>

        <p style="font-size: 16px; font-weight: 500; margin: 0 0 1rem;">Filter by account</p>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1rem;">

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-building-bank" style="font-size:20px; color: var(--text-secondary);"></i>
                    <span style="font-size: 14px;">Main bank</span>
                </div>
                <div style="width: 20px; height: 20px; border-radius: 5px; background: var(--fill-accent); display: flex; align-items: center; justify-content: center;">
                    <i aria-hidden="true" class="ti ti-check"
                       style="font-size:13px; color: var(--on-accent);"></i></div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true" class="ti ti-wallet"
                       style="font-size:20px; color: var(--text-secondary);"></i>
                    <span style="font-size: 14px;">Cash</span>
                </div>
                <div style="width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border-strong);"></div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-credit-card" style="font-size:20px; color: var(--text-secondary);"></i>
                    <span style="font-size: 14px;">Visa card</span>
                </div>
                <div style="width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--border-strong);"></div>
            </div>

        </div>

        <button style="width: 100%; padding: 12px; background: var(--fill-primary); color: var(--on-primary); border-radius: var(--radius); font-size: 14px; font-weight: 500; border: none;">
            Apply
        </button>

    </div>
</div>
