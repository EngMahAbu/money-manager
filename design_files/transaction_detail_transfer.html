<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Full transaction detail screen for a transfer transaction, showing the
        amount colored blue with a transfer icon, and from and to account rows instead of a single
        account row</h2>
    <div style="background: var(--surface-2); border-radius: 16px; border: 0.5px solid var(--border); padding: 1.25rem;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <i aria-hidden="true" class="ti ti-arrow-left"
               style="font-size:20px; color: var(--text-secondary);"></i>
            <div style="display: flex; gap: 16px;">
                <i aria-hidden="true" class="ti ti-pencil"
                   style="font-size:19px; color: var(--text-secondary);"></i>
                <i aria-hidden="true" class="ti ti-trash"
                   style="font-size:19px; color: var(--text-danger);"></i>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
                <i aria-hidden="true" class="ti ti-arrow-right"
                   style="font-size:22px; color: var(--text-accent);"></i></div>
            <p style="font-size: 32px; font-weight: 500; margin: 0; color: var(--text-accent);">
                $500.00</p>
            <p style="font-size: 14px; color: var(--text-secondary); margin: 4px 0 0;">Transfer</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i aria-hidden="true"
                                                                               class="ti ti-wallet"
                                                                               style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">From</span></div>
                <span style="font-size: 14px;">Main bank</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i
                        aria-hidden="true"
                        class="ti ti-arrow-right"
                        style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">To</span></div>
                <span style="font-size: 14px;">Cash</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i
                        aria-hidden="true" class="ti ti-calendar"
                        style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">Date</span></div>
                <span style="font-size: 14px;">Today</span>
            </div>
        </div>

    </div>
</div>
