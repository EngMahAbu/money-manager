<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Full accounts screen with a net worth summary, a full list of active
        accounts, and a collapsible archived accounts section</h2>
    <div style="background: var(--surface-2); border-radius: 16px; border: 0.5px solid var(--border); padding: 1.25rem;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i aria-hidden="true" class="ti ti-arrow-left"
                   style="font-size:20px; color: var(--text-secondary);"></i>
                <p style="font-size: 18px; font-weight: 500; margin: 0;">Accounts</p>
            </div>
            <i aria-hidden="true" class="ti ti-plus"
               style="font-size:20px; color: var(--text-accent);"></i>
        </div>

        <div style="background: var(--surface-1); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.25rem;">
            <p style="font-size: 12px; color: var(--text-secondary); margin: 0 0 4px;">Net worth</p>
            <p style="font-size: 26px; font-weight: 500; margin: 0;">$12,080</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1.25rem;">

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-building-bank" style="font-size:20px; color: var(--text-secondary);"></i>
                    <div><p style="font-size: 14px; margin: 0;">Main bank</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Bank
                            account</p></div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;"><span
                        style="font-size: 14px; font-weight: 500;">$11,860</span><i
                        aria-hidden="true"
                        class="ti ti-chevron-right" style="font-size:16px; color: var(--text-muted);"></i>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true" class="ti ti-wallet"
                       style="font-size:20px; color: var(--text-secondary);"></i>
                    <div><p style="font-size: 14px; margin: 0;">Cash</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Cash</p>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;"><span
                        style="font-size: 14px; font-weight: 500;">$420</span><i
                        aria-hidden="true"
                        class="ti ti-chevron-right" style="font-size:16px; color: var(--text-muted);"></i>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-credit-card" style="font-size:20px; color: var(--text-secondary);"></i>
                    <div><p style="font-size: 14px; margin: 0;">Visa card</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Credit
                            card</p></div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;"><span
                        style="font-size: 14px; font-weight: 500; color: var(--text-danger);">-$200</span><i
                        aria-hidden="true"
                        class="ti ti-chevron-right" style="font-size:16px; color: var(--text-muted);"></i>
                </div>
            </div>

        </div>

        <div style="border-top: 0.5px solid var(--border); padding-top: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 13px; color: var(--text-secondary);">Archived (2)</span>
                <i aria-hidden="true" class="ti ti-chevron-down"
                   style="font-size:16px; color: var(--text-muted);"></i>
            </div>
        </div>

    </div>
</div>
