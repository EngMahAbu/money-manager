<div style="min-height: 400px; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; border-radius: 12px; padding: 1rem 0;">
    <h2 class="sr-only">Date picker bottom sheet with quick shortcuts for today and yesterday, and a
        month calendar grid with the current date highlighted</h2>
    <div style="background: var(--surface-2); border-radius: 20px 20px 0 0; padding: 1.25rem; width: 380px; max-width: 100%;">

        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 1rem;"></div>

        <p style="font-size: 16px; font-weight: 500; margin: 0 0 12px;">Choose date</p>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-bottom: 1rem;">
            <button style="padding: 8px; font-size: 13px;">Today</button>
            <button style="padding: 8px; font-size: 13px;">Yesterday</button>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
            <i aria-hidden="true" class="ti ti-chevron-left"
               style="font-size:18px; color: var(--text-secondary);"></i>
            <span style="font-size: 14px; font-weight: 500;">August 2026</span>
            <i aria-hidden="true" class="ti ti-chevron-right"
               style="font-size:18px; color: var(--text-secondary);"></i>
        </div>

        <div style="display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; margin-bottom: 4px;">
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">S</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">M</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">T</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">W</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">T</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">F</span>
            <span style="text-align:center; font-size: 11px; color: var(--text-muted);">S</span>
        </div>

        <div style="display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px;">
            <span></span><span></span><span></span><span></span><span></span><span></span>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">1</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">2</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">3</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">4</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">5</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">6</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">7</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">8</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">9</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">10</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">11</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">12</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">13</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">14</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">15</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">16</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">17</div>
            <div style="text-align: center; font-size: 13px; padding: 6px 0; background: var(--fill-accent); color: var(--on-accent); border-radius: 50%;">
                18

            <div style="text-align:center; font-size: 13px; padding: 6px 0;">19</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">20</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">21</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">22</div>
            <div style="text-align:center; font-size: 13px; padding: 6px 0;">23</div>

    </div>
