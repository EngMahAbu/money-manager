<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Transactions screen in search mode with an active search input replacing the
        title, and filtered results matching the query</h2>
    <div style="background: var(--surface-2); border-radius: 16px; border: 0.5px solid var(--border); padding: 1.25rem;">

        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;">
            <i aria-hidden="true" class="ti ti-arrow-left"
               style="font-size:20px; color: var(--text-secondary);"></i>
            <input placeholder="Search transactions" style="flex: 1; font-size: 14px;" type="text"
                   value="gro"/>
            <i aria-hidden="true" class="ti ti-x"
               style="font-size:18px; color: var(--text-muted);"></i>
        </div>

        <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 12px;">2 results</p>

        <div style="display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid var(--border);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true"
                           class="ti ti-shopping-cart"
                           style="font-size:16px; color: var(--text-danger);"></i></div>
                    <div><p style="font-size: 14px; margin: 0;"><span
                            style="color: var(--text-accent); font-weight: 500;">Gro</span>ceries
                    </p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Today ·
                            Main bank</p></div>
                </div>
                <span style="font-size: 14px; font-weight: 500; color: var(--text-danger);">-$64</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true"
                           class="ti ti-shopping-cart"
                           style="font-size:16px; color: var(--text-danger);"></i></div>
                    <div><p style="font-size: 14px; margin: 0;"><span
                            style="color: var(--text-accent); font-weight: 500;">Gro</span>cery run
                    </p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">Aug 2 ·
                            Cash</p></div>
                </div>
                <span style="font-size: 14px; font-weight: 500; color: var(--text-danger);">-$22</span>
            </div>
        </div>

    </div>
</div>
