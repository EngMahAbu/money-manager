name: money_manager
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.1.0

  # DI
  get_it: ^7.7.0
  injectable: ^2.5.0

  # Routing
  go_router: ^14.3.0

  # Persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Utilities
  rxdart: ^0.28.0
  intl: ^0.20.2
  flutter_tabler_icons: ^1.2.0

  # Charts
  fl_chart: ^0.70.2

  # Hardware/System
  image_picker: ^1.1.2
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Generators
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  drift_dev: ^2.20.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
