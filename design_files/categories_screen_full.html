<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Full categories screen split into income and expense sections, each with
        draggable rows, plus a collapsed archived section</h2>
    <div style="background: var(--surface-2); border-radius: 16px; border: 0.5px solid var(--border); padding: 1.25rem;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <i aria-hidden="true" class="ti ti-arrow-left"
                   style="font-size:20px; color: var(--text-secondary);"></i>
                <p style="font-size: 18px; font-weight: 500; margin: 0;">Categories</p>
            </div>
            <i aria-hidden="true" class="ti ti-plus"
               style="font-size:20px; color: var(--text-accent);"></i>
        </div>

        <p style="font-size: 13px; font-weight: 500; color: var(--text-success); margin: 0 0 8px;">
            Income</p>
        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1.25rem;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i aria-hidden="true" class="ti ti-grip-vertical"
                       style="font-size:16px; color: var(--text-muted);"></i>
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-success); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true"
                           class="ti ti-briefcase"
                           style="font-size:15px; color: var(--text-success);"></i></div>
                    <span style="font-size: 14px;">Salary</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i aria-hidden="true" class="ti ti-grip-vertical"
                       style="font-size:16px; color: var(--text-muted);"></i>
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-success); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-gift"
                           style="font-size:15px; color: var(--text-success);"></i></div>
                    <span style="font-size: 14px;">Gifts</span>
                </div>
            </div>
        </div>

        <p style="font-size: 13px; font-weight: 500; color: var(--text-danger); margin: 0 0 8px;">
            Expense</p>
        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1.25rem;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i aria-hidden="true" class="ti ti-grip-vertical"
                       style="font-size:16px; color: var(--text-muted);"></i>
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true"
                           class="ti ti-shopping-cart"
                           style="font-size:15px; color: var(--text-danger);"></i></div>
                    <span style="font-size: 14px;">Groceries</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i aria-hidden="true" class="ti ti-grip-vertical"
                       style="font-size:16px; color: var(--text-muted);"></i>
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-bolt"
                           style="font-size:15px; color: var(--text-danger);"></i></div>
                    <span style="font-size: 14px;">Utilities</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i aria-hidden="true" class="ti ti-grip-vertical"
                       style="font-size:16px; color: var(--text-muted);"></i>
                    <div style="width: 30px; height: 30px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-movie"
                           style="font-size:15px; color: var(--text-danger);"></i></div>
                    <span style="font-size: 14px;">Entertainment</span>
                </div>
            </div>
        </div>

        <div style="border-top: 0.5px solid var(--border); padding-top: 12px;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <span style="font-size: 13px; color: var(--text-secondary);">Archived (1)</span>
                <i aria-hidden="true" class="ti ti-chevron-down"
                   style="font-size:16px; color: var(--text-muted);"></i>
            </div>
        </div>

    </div>
</div>
