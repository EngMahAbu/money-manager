<div style="min-height: 400px; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; border-radius: 12px; padding: 1rem 0;">
    <h2 class="sr-only">Account picker bottom sheet showing a list of accounts with balances, a
        selected checkmark, and an add account option</h2>
    <div style="background: var(--surface-2); border-radius: 20px 20px 0 0; padding: 1.25rem; width: 380px; max-width: 100%;">

        <div style="width: 36px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 0 auto 1rem;"></div>

        <p style="font-size: 16px; font-weight: 500; margin: 0 0 1rem;">Choose account</p>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1rem;">

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--bg-accent); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-building-bank" style="font-size:20px; color: var(--text-accent);"></i>
                    <div>
                        <p style="font-size: 14px; font-weight: 500; margin: 0; color: var(--text-accent);">
                            Main bank</p>
                        <p style="font-size: 12px; margin: 0; color: var(--text-accent);">
                            $11,860</p></div>
                </div>
                <i aria-hidden="true" class="ti ti-check"
                   style="font-size:18px; color: var(--text-accent);"></i>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true" class="ti ti-wallet"
                       style="font-size:20px; color: var(--text-secondary);"></i>
                    <div><p style="font-size: 14px; margin: 0;">Cash</p>
                        <p style="font-size: 12px; color: var(--text-muted); margin: 0;">$420</p>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <i aria-hidden="true"
                       class="ti ti-credit-card" style="font-size:20px; color: var(--text-secondary);"></i>
                    <div><p style="font-size: 14px; margin: 0;">Visa card</p>
                        <p style="font-size: 12px; color: var(--text-danger); margin: 0;">-$200</p>
                    </div>
                </div>
            </div>

        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 0.5px solid var(--border);">
            <i aria-hidden="true" class="ti ti-plus"
               style="font-size:18px; color: var(--text-accent);"></i>
            <span style="font-size: 14px; color: var(--text-accent);">Add account</span>
        </div>

    </div>
</div>
