<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Unified receipt attachment design using the same plus tile pattern whether
        zero, one, or multiple images are attached</h2>
    <div style="display: flex; flex-direction: column; gap: 16px;">

        <div>
            <p style="font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px;">
                Empty — zero receipts</p>
            <div style="padding: 10px 12px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <i aria-hidden="true" class="ti ti-receipt"
                       style="font-size:16px; color: var(--text-secondary);"></i>
                    <span style="font-size: 13px; color: var(--text-secondary);">Receipts</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--surface-1); border: 0.5px dashed var(--border-strong); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-plus"
                           style="font-size:18px; color: var(--text-muted);"></i>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <p style="font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px;">
                One receipt attached</p>
            <div style="padding: 10px 12px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <i aria-hidden="true" class="ti ti-receipt"
                       style="font-size:16px; color: var(--text-secondary);"></i>
                    <span style="font-size: 13px; color: var(--text-secondary);">Receipts</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--bg-accent); display: flex; align-items: center; justify-content: center; position: relative;">
                        <i aria-hidden="true" class="ti ti-receipt"
                           style="font-size:22px; color: var(--text-accent);"></i>
                        <div style="position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center;">
                            <i aria-hidden="true" class="ti ti-x"
                               style="font-size:11px; color: var(--text-secondary);"></i></div>
                    </div>
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--surface-1); border: 0.5px dashed var(--border-strong); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-plus"
                           style="font-size:18px; color: var(--text-muted);"></i>
                    </div>
                </div>
            </div>
        </div>

        <div>
            <p style="font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px;">
                Two receipts attached</p>
            <div style="padding: 10px 12px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                    <i aria-hidden="true" class="ti ti-receipt"
                       style="font-size:16px; color: var(--text-secondary);"></i>
                    <span style="font-size: 13px; color: var(--text-secondary);">Receipts</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--bg-accent); display: flex; align-items: center; justify-content: center; position: relative;">
                        <i aria-hidden="true" class="ti ti-receipt"
                           style="font-size:22px; color: var(--text-accent);"></i>
                        <div style="position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center;">
                            <i aria-hidden="true" class="ti ti-x"
                               style="font-size:11px; color: var(--text-secondary);"></i></div>
                    </div>
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--bg-accent); display: flex; align-items: center; justify-content: center; position: relative;">
                        <i aria-hidden="true" class="ti ti-receipt"
                           style="font-size:22px; color: var(--text-accent);"></i>
                        <div style="position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-2); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center;">
                            <i aria-hidden="true" class="ti ti-x"
                               style="font-size:11px; color: var(--text-secondary);"></i></div>
                    </div>
                    <div style="width: 52px; height: 52px; border-radius: 6px; background: var(--surface-1); border: 0.5px dashed var(--border-strong); display: flex; align-items: center; justify-content: center;">
                        <i aria-hidden="true" class="ti ti-plus"
                           style="font-size:18px; color: var(--text-muted);"></i>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
