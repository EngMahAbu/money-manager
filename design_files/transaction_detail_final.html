<div style="background: var(--surface-1); border-radius: 12px; padding: 1.5rem 0.75rem; max-width: 380px; margin: 0 auto;">
    <h2 class="sr-only">Final transaction detail screen for an expense with no note or receipts,
        showing muted placeholder rows for both instead of hiding the sections</h2>
    <div style="background: var(--surface-2); border-radius: 16px; border: 0.5px solid var(--border); padding: 1.25rem;">

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
            <i aria-hidden="true" class="ti ti-arrow-left"
               style="font-size:20px; color: var(--text-secondary);"></i>
            <div style="display: flex; gap: 16px;">
                <i aria-hidden="true" class="ti ti-pencil"
                   style="font-size:19px; color: var(--text-secondary);"></i>
                <i aria-hidden="true" class="ti ti-trash"
                   style="font-size:19px; color: var(--text-danger);"></i>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--bg-danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
                <i aria-hidden="true" class="ti ti-car"
                   style="font-size:22px; color: var(--text-danger);"></i></div>
            <p style="font-size: 32px; font-weight: 500; margin: 0; color: var(--text-danger);">
                $15.00</p>
            <p style="font-size: 14px; color: var(--text-secondary); margin: 4px 0 0;">Transport</p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 1.25rem;">
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i aria-hidden="true"
                                                                               class="ti ti-wallet"
                                                                               style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">Account</span></div>
                <span style="font-size: 14px;">Cash</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i
                        aria-hidden="true" class="ti ti-calendar"
                        style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">Date</span></div>
                <span style="font-size: 14px;">45 days ago</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px; background: var(--surface-1); border-radius: var(--radius);">
                <div style="display: flex; align-items: center; gap: 10px;"><i aria-hidden="true"
                                                                               class="ti ti-note"
                                                                               style="font-size:18px; color: var(--text-secondary);"></i><span
                        style="font-size: 14px; color: var(--text-secondary);">Note</span></div>
                <span style="font-size: 14px; color: var(--text-muted); font-style: italic;">No note added</span>
            </div>
        </div>

        <p style="font-size: 13px; color: var(--text-secondary); margin: 0 0 8px;">Receipts</p>
        <p style="font-size: 13px; color: var(--text-muted); font-style: italic; padding: 12px; background: var(--surface-1); border-radius: var(--radius); margin: 0;">
            No receipts attached</p>

    </div>
</div>
